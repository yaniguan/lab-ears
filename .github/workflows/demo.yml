name: demo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: git clone --depth 1 https://github.com/chaitanya2334/WLP-Dataset data/WLP-Dataset
      - run: python demo/parse_protocol.py
